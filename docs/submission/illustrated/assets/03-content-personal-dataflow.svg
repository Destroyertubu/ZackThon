<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-label="数据如何流动：同一份材料，跨场景继续使用">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#237b78"/></marker></defs>
<style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#31545a}.title{font-size:34px;font-weight:700;fill:#123f46}.sub{font-size:23px;fill:#667b7e}.heading{font-size:27px;font-weight:650;fill:#123f46}.body{font-size:23px}.tag{font-size:22px;font-weight:600;fill:#237b78}.small{font-size:22px;fill:#667b7e}</style>
<rect width="1200" height="980" fill="white"/>
<text x="40" y="52" class="title" text-anchor="start">数据如何流动：同一份材料，跨场景继续使用</text>
<text x="40" y="93" class="sub" text-anchor="start">公共检索缓存与个人创作分开存储；星树是收藏的空间呈现。</text>
<rect x="40" y="142" width="500" height="648" rx="16" fill="white" stroke="#b8d8d3" stroke-width="2"/>
<text x="64" y="184" class="tag" text-anchor="start">服务端 · 公共内容</text>
<rect x="660" y="142" width="500" height="648" rx="16" fill="white" stroke="#ad7d28" stroke-width="2"/>
<text x="684" y="184" class="tag" text-anchor="start">玩家浏览器 · 私人空间</text>
<rect x="63" y="211" width="454" height="138" rx="16" fill="#ecf6f4" stroke="#b8d8d3" stroke-width="2"/>
<text x="87" y="255" class="heading" text-anchor="start">公开来源</text>
<text x="87" y="294" class="body" text-anchor="start">知乎 CLI 检索 / 热榜</text>
<text x="87" y="328" class="body" text-anchor="start">知识作品真实快照 / 公开详情</text>
<polyline points="290,349 290,398" fill="none" stroke="#237b78" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="63" y="411" width="454" height="199" rx="16" fill="#ecf6f4" stroke="#b8d8d3" stroke-width="2"/>
<text x="87" y="455" class="heading" text-anchor="start">统一内容服务</text>
<text x="87" y="494" class="body" text-anchor="start">保留标题、作者、类型与原文链接</text>
<text x="87" y="528" class="body" text-anchor="start">SQLite 持久保存检索与来源快照</text>
<text x="87" y="562" class="body" text-anchor="start">缓存命中复用；预算重启后保留</text>
<text x="84" y="669" class="small" text-anchor="start">知识作品正文另有快照 / 详情入口</text>
<text x="84" y="721" class="small" text-anchor="start">公共缓存不保存个人笔记，</text>
<text x="84" y="754" class="small" text-anchor="start">也不保存 AI 生成的私人草稿。</text>
<rect x="683" y="211" width="454" height="138" rx="16" fill="#ecf6f4" stroke="#b8d8d3" stroke-width="2"/>
<text x="707" y="255" class="heading" text-anchor="start">所有场景读取同一份个人资料</text>
<text x="707" y="294" class="body" text-anchor="start">星系 / 星树 / 小屋 / 主题旅程</text>
<text x="707" y="328" class="body" text-anchor="start">收藏、批注与足迹继续关联</text>
<rect x="683" y="411" width="454" height="155" rx="16" fill="#ecf6f4" stroke="#b8d8d3" stroke-width="2"/>
<text x="707" y="455" class="heading" text-anchor="start">统一来源身份</text>
<text x="707" y="494" class="body" text-anchor="start">sourceId + 原文链接</text>
<text x="707" y="528" class="body" text-anchor="start">收藏与笔记各有独立记录</text>
<polyline points="540,488 648,488" fill="none" stroke="#237b78" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="600" y="456" class="small" text-anchor="middle">材料</text>
<polyline points="910,349 910,399" fill="none" stroke="#237b78" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="683" y="646" width="454" height="116" rx="16" fill="#fff6e6" stroke="#b8d8d3" stroke-width="2"/>
<text x="707" y="690" class="heading" text-anchor="start">IndexedDB · 个人存档</text>
<text x="707" y="729" class="body" text-anchor="start">收藏 / 笔记 / 作品 / 旅程进度</text>
<polyline points="1080,566 1080,634" fill="none" stroke="#237b78" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="710" y="603" class="small" text-anchor="start">同一来源关联各条记录</text>
<rect x="40" y="837" width="1120" height="101" rx="16" fill="#fff6e6" stroke="#b8d8d3" stroke-width="2"/>
<text x="65" y="877" class="heading" text-anchor="start">主动合成时，玩家选择要交给 AI 的材料和笔记。</text>
<text x="65" y="914" class="small" text-anchor="start">服务端返回草稿 → 玩家编辑与采纳 → 保存为本机作品；个人资料支持 JSON 导入与导出。</text>
</svg>

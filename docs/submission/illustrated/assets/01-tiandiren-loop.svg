<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-label="天地人：从发现知识，到带回自己的作品">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#237b78"/></marker></defs>
<style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#31545a}.title{font-size:34px;font-weight:700;fill:#123f46}.sub{font-size:23px;fill:#667b7e}.heading{font-size:27px;font-weight:650;fill:#123f46}.body{font-size:23px}.tag{font-size:22px;font-weight:600;fill:#237b78}.small{font-size:22px;fill:#667b7e}</style>
<rect width="1200" height="870" fill="white"/>
<text x="40" y="52" class="title" text-anchor="start">天地人：从发现知识，到带回自己的作品</text>
<text x="40" y="93" class="sub" text-anchor="start">当前核心体验已连通；“地”的实践与共同建设继续延展。</text>
<rect x="65" y="150" width="310" height="185" rx="16" fill="#ecf6f4" stroke="#b8d8d3" stroke-width="2"/>
<text x="89" y="184" class="tag" text-anchor="start">01  /  天</text>
<text x="89" y="231" class="heading" text-anchor="start">星空发现</text>
<text x="89" y="273" class="body" text-anchor="start">深入主题、问题与作品</text>
<text x="89" y="307" class="body" text-anchor="start">相遇不同观点与灵感</text>
<rect x="445" y="150" width="310" height="185" rx="16" fill="#ecf6f4" stroke="#b8d8d3" stroke-width="2"/>
<text x="469" y="184" class="tag" text-anchor="start">02  /  天</text>
<text x="469" y="231" class="heading" text-anchor="start">阅读与思考</text>
<text x="469" y="273" class="body" text-anchor="start">阅读与收藏材料</text>
<text x="469" y="307" class="body" text-anchor="start">选段批注，记录足迹</text>
<rect x="825" y="150" width="310" height="185" rx="16" fill="#fff6e6" stroke="#b8d8d3" stroke-width="2"/>
<text x="849" y="184" class="tag" text-anchor="start">03  /  人</text>
<text x="849" y="231" class="heading" text-anchor="start">回到个人空间</text>
<text x="849" y="273" class="body" text-anchor="start">观星台 · 星树 · 小屋</text>
<text x="849" y="307" class="body" text-anchor="start">收纳兴趣，锻造与沉淀</text>
<rect x="825" y="460" width="310" height="185" rx="16" fill="#fff6e6" stroke="#b8d8d3" stroke-width="2"/>
<text x="849" y="494" class="tag" text-anchor="start">04  /  人</text>
<text x="849" y="541" class="heading" text-anchor="start">思想调酒</text>
<text x="849" y="583" class="body" text-anchor="start">五种原料，两两相遇</text>
<text x="849" y="617" class="body" text-anchor="start">形成配方，自动启程</text>
<rect x="445" y="460" width="310" height="185" rx="16" fill="#ecf6f4" stroke="#b8d8d3" stroke-width="2"/>
<text x="469" y="494" class="tag" text-anchor="start">05  /  地</text>
<text x="469" y="541" class="heading" text-anchor="start">十种主题旅程</text>
<text x="469" y="583" class="body" text-anchor="start">五个停靠点串起体验</text>
<text x="469" y="617" class="body" text-anchor="start">观察、比较、摄影、创作</text>
<rect x="65" y="460" width="310" height="185" rx="16" fill="#fff6e6" stroke="#b8d8d3" stroke-width="2"/>
<text x="89" y="494" class="tag" text-anchor="start">06  /  人</text>
<text x="89" y="541" class="heading" text-anchor="start">带着作品回家</text>
<text x="89" y="583" class="body" text-anchor="start">保存照片、文字与节拍</text>
<text x="89" y="617" class="body" text-anchor="start">让新认识成为下一次起点</text>
<polyline points="375,242 433,242" fill="none" stroke="#237b78" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="755,242 813,242" fill="none" stroke="#237b78" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="980,335 980,448" fill="none" stroke="#237b78" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="825,553 767,553" fill="none" stroke="#237b78" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="445,553 387,553" fill="none" stroke="#237b78" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="220,460 220,347" fill="none" stroke="#237b78" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="251" y="404" class="small" text-anchor="start">再次探索</text>
<rect x="65" y="710" width="1070" height="113" rx="16" fill="white" stroke="#ad7d28" stroke-width="2" stroke-dasharray="9 7"/>
<text x="88" y="752" class="heading" text-anchor="start">未来 · 将灵感种向大地与远方</text>
<text x="88" y="792" class="body" text-anchor="start">从已有陆地与旅程，走向实践任务、多人共建和彼此连接的知识世界。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1090" viewBox="0 0 1200 1090" role="img" aria-label="工程架构：浏览器中的 3D 游戏，服务端的内容能力">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#237b78"/></marker></defs>
<style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#31545a}.title{font-size:34px;font-weight:700;fill:#123f46}.sub{font-size:23px;fill:#667b7e}.heading{font-size:27px;font-weight:650;fill:#123f46}.body{font-size:23px}.tag{font-size:22px;font-weight:600;fill:#237b78}.small{font-size:22px;fill:#667b7e}</style>
<rect width="1200" height="1090" fill="white"/>
<text x="40" y="52" class="title" text-anchor="start">工程架构：浏览器中的 3D 游戏，服务端的内容能力</text>
<text x="40" y="93" class="sub" text-anchor="start">React + TypeScript + Vite  /  Three.js  /  Node.js + Express</text>
<rect x="40" y="132" width="1120" height="235" rx="16" fill="white" stroke="#b8d8d3" stroke-width="2"/>
<text x="62" y="169" class="tag" text-anchor="start">玩家浏览器 · 场景按路由切换</text>
<rect x="60" y="190" width="335" height="150" rx="16" fill="#ecf6f4" stroke="#b8d8d3" stroke-width="2"/>
<text x="84" y="234" class="heading" text-anchor="start">第一人称 3D 场景</text>
<text x="84" y="273" class="body" text-anchor="start">R3F + Three.js + Drei</text>
<text x="84" y="307" class="body" text-anchor="start">小屋 / 观星台 / 陆地 / 旅程</text>
<rect x="432" y="190" width="335" height="150" rx="16" fill="#ecf6f4" stroke="#b8d8d3" stroke-width="2"/>
<text x="456" y="234" class="heading" text-anchor="start">星系与交互内容</text>
<text x="456" y="273" class="body" text-anchor="start">原生 Three.js 星系渲染</text>
<text x="456" y="307" class="body" text-anchor="start">React 阅读、收藏与批注</text>
<rect x="804" y="190" width="335" height="150" rx="16" fill="#ecf6f4" stroke="#b8d8d3" stroke-width="2"/>
<text x="828" y="234" class="heading" text-anchor="start">个人状态与存档</text>
<text x="828" y="273" class="body" text-anchor="start">Zustand 统一个人状态</text>
<text x="828" y="307" class="body" text-anchor="start">IndexedDB 本机持久保存</text>
<polyline points="410,367 410,430" fill="none" stroke="#237b78" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="442" y="404" class="small" text-anchor="start">同源 HTTP /api · 内容请求与响应</text>
<rect x="40" y="443" width="750" height="420" rx="16" fill="white" stroke="#b8d8d3" stroke-width="2"/>
<text x="62" y="485" class="tag" text-anchor="start">服务端 · Node.js 24 + Express</text>
<rect x="61" y="509" width="342" height="187" rx="16" fill="#ecf6f4" stroke="#b8d8d3" stroke-width="2"/>
<text x="85" y="553" class="heading" text-anchor="start">公共内容服务</text>
<text x="85" y="592" class="body" text-anchor="start">检索 · 热榜 · 问题展开</text>
<text x="85" y="626" class="body" text-anchor="start">SQLite：检索、来源与预算</text>
<text x="85" y="660" class="body" text-anchor="start">知识作品：真实快照与详情</text>
<rect x="425" y="509" width="342" height="187" rx="16" fill="#ecf6f4" stroke="#b8d8d3" stroke-width="2"/>
<text x="449" y="553" class="heading" text-anchor="start">思想合成服务</text>
<text x="449" y="592" class="body" text-anchor="start">核验来源与调用预算</text>
<text x="449" y="626" class="body" text-anchor="start">选定材料 → 可编辑草稿</text>
<text x="449" y="660" class="body" text-anchor="start">用户编辑采纳后才保存</text>
<polyline points="232,696 232,740" fill="none" stroke="#237b78" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="596,696 596,740" fill="none" stroke="#237b78" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="61" y="753" width="706" height="82" rx="16" fill="#fff6e6" stroke="#b8d8d3" stroke-width="2"/>
<text x="85" y="788" class="heading" text-anchor="start">服务端知乎 CLI 适配器</text>
<text x="85" y="819" class="small" text-anchor="start">独立参数调用；认证留在服务端；检索优先复用缓存</text>
<rect x="853" y="509" width="307" height="326" rx="16" fill="white" stroke="#ad7d28" stroke-width="2"/>
<text x="877" y="553" class="heading" text-anchor="start">知乎开放能力</text>
<text x="877" y="603" class="body" text-anchor="start">公共搜索与全网搜索</text>
<text x="877" y="643" class="body" text-anchor="start">热榜与相关内容接口</text>
<text x="877" y="683" class="body" text-anchor="start">知乎直答：草稿合成</text>
<text x="877" y="762" class="small" text-anchor="start">按服务配置及额度使用</text>
<text x="877" y="796" class="small" text-anchor="start">失败如实反馈</text>
<polyline points="779,794 841,794" fill="none" stroke="#237b78" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="40" y="915" width="1120" height="124" rx="16" fill="#fff6e6" stroke="#b8d8d3" stroke-width="2"/>
<text x="65" y="956" class="heading" text-anchor="start">交付与运行</text>
<text x="65" y="994" class="small" text-anchor="start">普通入口由浏览器完成 WebGL 渲染，Express 提供页面、静态资源与 API。</text>
<text x="65" y="1026" class="small" text-anchor="start">公网隧道连接现有服务；个人存档在当前浏览器，未接入知乎 OAuth 或账号云同步。</text>
</svg>

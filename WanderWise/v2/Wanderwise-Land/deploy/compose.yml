# Run from project root: docker compose -f deploy/compose.yml up --build
# This LOCAL profile does not claim public HTTPS deployment.
services:
  wanderwise:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      WANDERWISE_DB: /app/data/wanderwise.sqlite3
      ZHIHU_ACCESS_SECRET: ${ZHIHU_ACCESS_SECRET:-}
      ZHIHU_SEARCH_DAILY_BUDGET: ${ZHIHU_SEARCH_DAILY_BUDGET:-1000}
      ZHIHU_AI_DAILY_BUDGET: ${ZHIHU_AI_DAILY_BUDGET:-50}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - wanderwise-data:/app/data
volumes:
  wanderwise-data:
